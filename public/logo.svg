<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="500" height="500" fill="#0b1329" />
  
  <!-- Geometric X / 4-petal symbol -->
  <g transform="translate(250, 205)" filter="url(#glow)">
    <path d="M 0,-85 C 40,-40 85,-20 120,0 C 85,20 40,40 0,85 C -40,40 -85,20 -120,0 C -85,-20 -40,-40 0,-85 Z" fill="url(#tealGrad)" transform="rotate(0)" />
    <path d="M 0,-85 C 40,-40 85,-20 120,0 C 85,20 40,40 0,85 C -40,40 -85,20 -120,0 C -85,-20 -40,-40 0,-85 Z" fill="url(#tealGrad)" transform="rotate(90)" />
  </g>
  
  <!-- Text LearnX -->
  <text x="250" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">LearnX</text>
</svg>
